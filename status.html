<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSC Status</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
            color: #ffffff;
            min-height: 100vh;
            position: relative;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.3);
            animation: pulse 2s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .brand-title {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #a0a0a0;
            margin-bottom: 1rem;
        }

        .powered-by {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 25px;
            font-size: 0.9rem;
            color: #b0b0b0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .overall-status {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 3rem;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .overall-status-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin: 0 auto 1rem;
            animation: statusPulse 2s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 currentColor; }
            50% { transform: scale(1.1); box-shadow: 0 0 0 10px transparent; }
        }

        .overall-status-text {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .overall-status-desc {
            color: #a0a0a0;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .service-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--status-color, #666);
            transition: all 0.3s ease;
        }

        .service-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .service-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
            background: var(--status-color, #666);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .service-info h3 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
        }

        .service-info .service-desc {
            color: #a0a0a0;
            font-size: 0.9rem;
        }

        .status-bar-container {
            position: relative;
            margin-bottom: 1rem;
        }

        .status-bar {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .status-fill {
            height: 100%;
            width: 100%;
            background: var(--status-color, #666);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            animation: statusGlow 2s ease-in-out infinite alternate;
        }

        @keyframes statusGlow {
            from { box-shadow: 0 0 5px var(--status-color, #666); }
            to { box-shadow: 0 0 15px var(--status-color, #666); }
        }

        .status-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .status-text {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
        }

        .status-label {
            font-weight: 600;
            color: var(--status-color, #666);
        }

        .status-time {
            font-size: 0.8rem;
            color: #a0a0a0;
        }

        /* Status Colors */
        .operational {
            --status-color: #00ff88;
        }

        .minor-outage {
            --status-color: #ffaa00;
        }

        .major-outage {
            --status-color: #ff4444;
        }

        .maintenance {
            --status-color: #4488ff;
        }

        .footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #a0a0a0;
        }

        .last-updated {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 1rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            color: #ff4444;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 2rem;
            text-align: center;
        }

        @media (max-width: 768px) {
            .brand-title {
                font-size: 2rem;
            }
            
            .services-grid {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <div class="logo">RSC</div>
                <div>
                    <h1 class="brand-title">Status</h1>
                    <p class="subtitle">Status Page Webview</p>
                </div>
            </div>
            <div class="powered-by">
                <i class="fas fa-bolt"></i>
                Powered by RSC
            </div>
        </div>

        <div class="overall-status" id="overallStatus">
            <div class="overall-status-indicator operational" id="overallIndicator"></div>
            <div class="overall-status-text" id="overallText">All Systems Operational</div>
            <div class="overall-status-desc">All services are running smoothly</div>
        </div>

        <div class="last-updated" id="lastUpdated">
            <i class="fas fa-clock"></i>
            <span id="updateTime">Loading...</span>
        </div>

        <div id="errorMessage" class="error-message" style="display: none;">
            <i class="fas fa-exclamation-triangle"></i>
            <span id="errorText">Unable to connect to status database</span>
        </div>

        <div class="services-grid" id="servicesGrid">
            <div class="service-card operational">
                <div class="service-header">
                    <div class="service-icon"><i class="fas fa-server"></i></div>
                    <div class="service-info">
                        <h3>Loading Services</h3>
                        <div class="service-desc">Please wait</div>
                    </div>
                </div>
                <div class="status-bar-container">
                    <div class="status-bar">
                        <div class="status-fill"></div>
                    </div>
                </div>
                <div class="status-text">
                    <span class="status-label">
                        <span class="loading-spinner"></span> Loading
                    </span>
                    <span class="status-time">--:--</span>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>&copy; 2025 RSC Corp. Powered by RSC.</p>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAcWALZRAwCi-fF8WPRtVEig6pT2O5gBuQ",
            authDomain: "rsc-s-s-d-b.firebaseapp.com",
            projectId: "rsc-s-s-d-b",
            storageBucket: "rsc-s-s-d-b.firebasestorage.app",
            messagingSenderId: "503880882102",
            appId: "1:503880882102:web:9a034dc1c6a32731519317",
            measurementId: "G-MQ94QGEL9V"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Service configurations
        const serviceConfigs = {
            'api-gateway': {
                name: 'API Gateway',
                icon: 'fas fa-exchange-alt',
                description: 'Core API services'
            },
            'database': {
                name: 'Database Cluster',
                icon: 'fas fa-database',
                description: 'Primary data storage'
            },
            'authentication': {
                name: 'Authentication',
                icon: 'fas fa-shield-alt',
                description: 'User authentication system'
            },
            'file-storage': {
                name: 'File Storage',
                icon: 'fas fa-cloud',
                description: 'Document and media storage'
            },
            'cdn': {
                name: 'Content Delivery',
                icon: 'fas fa-globe',
                description: 'Global content network'
            },
            'monitoring': {
                name: 'System Monitoring',
                icon: 'fas fa-chart-line',
                description: 'Performance tracking'
            },
            'backup-systems': {
                name: 'Backup Systems',
                icon: 'fas fa-hdd',
                description: 'Data backup and recovery'
            },
            'load-balancer': {
                name: 'Load Balancer',
                icon: 'fas fa-balance-scale',
                description: 'Traffic distribution'
            }
        };

        let servicesData = {};
        let lastUpdateTime = new Date();

        function getStatusInfo(statusData) {
            if (statusData.status_operational) {
                return { 
                    class: 'operational', 
                    text: 'Operational', 
                    description: 'Service is running normally',
                    priority: 1
                };
            } else if (statusData.status_maintenance) {
                return { 
                    class: 'maintenance', 
                    text: 'Maintenance', 
                    description: 'Scheduled maintenance in progress',
                    priority: 2
                };
            } else if (statusData.status_minor) {
                return { 
                    class: 'minor-outage', 
                    text: 'Minor Issues', 
                    description: 'Some features may be affected',
                    priority: 3
                };
            } else if (statusData.status_outage) {
                return { 
                    class: 'major-outage', 
                    text: 'Major Outage', 
                    description: 'Service is currently unavailable',
                    priority: 4
                };
            }
            return { 
                class: 'operational', 
                text: 'Unknown', 
                description: 'Status unavailable',
                priority: 5
            };
        }

        function updateOverallStatus() {
            const statuses = Object.values(servicesData).map(data => getStatusInfo(data));
            const highestPriority = Math.max(...statuses.map(s => s.priority));
            
            const overallIndicator = document.getElementById('overallIndicator');
            const overallText = document.getElementById('overallText');
            const overallStatus = document.getElementById('overallStatus');
            
            if (highestPriority === 4) {
                overallIndicator.className = 'overall-status-indicator major-outage';
                overallText.textContent = 'Major Service Disruption';
                overallStatus.querySelector('.overall-status-desc').textContent = 'RSC is currently experiencing a major outage, please be patient.';
            } else if (highestPriority === 3) {
                overallIndicator.className = 'overall-status-indicator minor-outage';
                overallText.textContent = 'Minor Service Issues';
                overallStatus.querySelector('.overall-status-desc').textContent = 'Some services may be disrupted, please be patient.';
            } else if (highestPriority === 2) {
                overallIndicator.className = 'overall-status-indicator maintenance';
                overallText.textContent = 'Maintenance in Progress';
                overallStatus.querySelector('.overall-status-desc').textContent = 'Scheduled maintenance is currently underway';
            } else {
                overallIndicator.className = 'overall-status-indicator operational';
                overallText.textContent = 'All Systems Operational';
                overallStatus.querySelector('.overall-status-desc').textContent = 'No outages reported';
            }
        }

        function renderServices() {
            const servicesGrid = document.getElementById('servicesGrid');
            const serviceEntries = Object.entries(servicesData);
            
            if (serviceEntries.length === 0) {
                servicesGrid.innerHTML = `
                    <div class="service-card operational">
                        <div class="service-header">
                            <div class="service-icon"><i class="fas fa-server"></i></div>
                            <div class="service-info">
                                <h3>No Services Found</h3>
                                <div class="service-desc">No service data available</div>
                            </div>
                        </div>
                        <div class="status-bar-container">
                            <div class="status-bar">
                                <div class="status-fill"></div>
                            </div>
                        </div>
                        <div class="status-text">
                            <span class="status-label">Unknown</span>
                            <span class="status-time">--:--</span>
                        </div>
                    </div>
                `;
                return;
            }

            servicesGrid.innerHTML = serviceEntries.map(([serviceId, statusData]) => {
                const config = serviceConfigs[serviceId] || {
                    name: serviceId.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase()),
                    icon: 'fas fa-cog',
                    description: 'System component'
                };
                
                const statusInfo = getStatusInfo(statusData);
                
                return `
                    <div class="service-card ${statusInfo.class}">
                        <div class="service-header">
                            <div class="service-icon"><i class="${config.icon}"></i></div>
                            <div class="service-info">
                                <h3>${config.name}</h3>
                                <div class="service-desc">${config.description}</div>
                            </div>
                        </div>
                        <div class="status-bar-container">
                            <div class="status-bar">
                                <div class="status-fill"></div>
                            </div>
                        </div>
                        <div class="status-text">
                            <span class="status-label">
                                <i class="fas fa-circle" style="font-size: 8px; margin-right: 6px;"></i>
                                ${statusInfo.text}
                            </span>
                            <span class="status-time">${lastUpdateTime.toLocaleTimeString()}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateLastUpdatedTime() {
            const updateTimeElement = document.getElementById('updateTime');
            updateTimeElement.innerHTML = `Last updated: <strong>${lastUpdateTime.toLocaleString()}</strong>`;
        }

        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorElement.style.display = 'block';
        }

        function hideError() {
            const errorElement = document.getElementById('errorMessage');
            errorElement.style.display = 'none';
        }

        // Listen for real-time updates
        try {
            const outagesRef = collection(db, 'outages');
            
            onSnapshot(outagesRef, (snapshot) => {
                hideError();
                servicesData = {};
                
                snapshot.forEach((doc) => {
                    servicesData[doc.id] = doc.data();
                });
                
                lastUpdateTime = new Date();
                renderServices();
                updateOverallStatus();
                updateLastUpdatedTime();
                
                console.log('Services updated:', Object.keys(servicesData).length, 'services loaded');
            }, (error) => {
                console.error('Error listening to outages:', error);
                showError('Unable to connect to status database. Please check your connection.');
            });
            
        } catch (error) {
            console.error('Error initializing db:', error);
            showError('Failed to initialize database connection.');
        }

        // Update time every minute
        setInterval(updateLastUpdatedTime, 60000);
    </script>
</body>
</html>
